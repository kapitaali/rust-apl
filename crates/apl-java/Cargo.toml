[package]
name = "apl-java"
version = "1.0.0"
edition = "2021"
description = "libapljava.so — JVM bridge for rust-apl; a CAbi-consumable shared object (EXTENSIONS.md §7)"

[dependencies]
jni = { version = "0.22", optional = true }
libloading = "0.8"

[features]
default = []
# full JVM invocation requires a JDK (java home headers); the skeleton
# bridge builds and loads without it, exporting the fixed surface with
# stubbed internals
java = ["jni"]

[lib]
crate-type = ["cdylib"]
